[tools]
node = "24"
watchexec = "latest"

[settings]
# Detect stale task outputs by hashing source contents, so an mtime-only change
# (a git checkout, a formatter touching a file) does not trigger a rebuild.
task.source_freshness_hash_contents = true

[tasks.bootstrap]
run = "./data/bootstrap_worktree.sh"
sources = []
outputs = { auto = true }

[tasks.dev]
depends = ["bootstrap"]
run = "npm run dev"
interactive = true

[tasks."data:basemap"]
run = "uv run python -m data.fetch_basemap"
sources = ["data/fetch_basemap.py"]
outputs = ["public/data/nyc.pmtiles"]

[tasks."data:roads"]
run = "uv run python -m data.fetch_osm_roads"
sources = ["data/fetch_osm_roads.py", "data/osm.py"]
outputs = ["public/data/osm_roads.geojson"]

[tasks."data:citibike_docks"]
run = "uv run python -m data.fetch_citibike_docks"
sources = ["data/fetch_citibike_docks.py"]
outputs = ["public/data/citibike_docks.geojson"]

[tasks."data:map_fonts"]
run = "uv run python -m data.fetch_map_fonts"
sources = ["data/fetch_map_fonts.py"]
outputs = ["public/data/fonts"]

[tasks."data:location_search"]
run = "node --import tsx data/fetch_location_search.ts"
sources = ["data/fetch_location_search.ts", "data/location_search.ts"]
outputs = ["public/data/location_search"]

[tasks."data:subway_geojson"]
run = "uv run python -m data.fetch_subway_geojson"
sources = ["data/fetch_subway_geojson.py"]
outputs = [
    "public/data/subway_entrances.geojson",
    "public/data/subway_stations.geojson",
]

[tasks."data:subway_gtfs"]
run = "uv run python -m data.fetch_subway_gtfs"
sources = ["data/fetch_subway_gtfs.py"]
outputs = ["data/gtfs"]

[tasks."data:subway_track_graph"]
run = "uv run python -m data.build_subway_track_graph"
depends = ["data:subway_gtfs"]
sources = [
    "data/build_subway_track_graph.py",
    "data/gtfs_types.py",
    "data/gtfs/routes.txt",
    "data/gtfs/trips.txt",
    "data/gtfs/stops.txt",
    "data/gtfs/stop_times.txt",
    "data/gtfs/shapes.txt",
]
outputs = ["public/data/subway_track_graph.json"]

[tasks."data:subway_routes"]
run = "uv run python -m data.fetch_subway_route_lines"
sources = ["data/fetch_subway_route_lines.py"]
outputs = ["public/data/subway_routes.geojson"]

[tasks."data:subway_stations"]
run = "uv run python -m data.fetch_subway_station_routes"
sources = ["data/fetch_subway_station_routes.py"]
outputs = [
    "public/data/subway_station_routes.geojson",
    "public/data/subway_bullets.json",
]

[tasks."data:all"]
depends = [
    "data:basemap",
    "data:citibike_docks",
    "data:location_search",
    "data:map_fonts",
    "data:roads",
    "data:subway_geojson",
    "data:subway_track_graph",
    "data:subway_routes",
    "data:subway_stations",
]

[tasks."python:check"]
run = [
    "uv run ruff format --check .",
    "uv run ruff check .",
    "uv run ty check",
    "uv run python -m unittest discover -s data -p '*_test.py'",
]
